services:
  db:
    # PostgreSQL 15 + pgvector 擴充：語意搜尋的向量就存在這裡，不另外架向量資料庫
    # （migrations/versions/0013_knowledge_chunks.py 會 CREATE EXTENSION vector）
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: regplatform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/regplatform
      UPLOAD_DIR: /app/storage/uploads
      AUTH_SESSION_COOKIE: ${AUTH_SESSION_COOKIE:-eq_session}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      # Compose exposes HTTP locally; set true only when serving through HTTPS.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-10}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      # AI 相關設定由 .env 帶入；沒有 API key 時系統一樣可以完整運作
      ENABLE_LLM_FALLBACK: ${ENABLE_LLM_FALLBACK:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      REGULATION_SOURCES: ${REGULATION_SOURCES:-mock}
      # 索引放在 volume，重建映像檔不必重新下載 31MB
      TAIWAN_LAW_INDEX_PATH: /app/data/generated/taiwan_law_index.json
      PCCES_INDEX_PATH: /app/data/generated/pcces_index.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # 上傳的檔案存在 volume，容器重建不會遺失
      - uploads:/app/storage/uploads
      - lawindex:/app/data/generated
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
  lawindex:
